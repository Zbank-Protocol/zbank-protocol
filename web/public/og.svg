<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1016"/>
      <stop offset="100%" stop-color="#0a070d"/>
    </linearGradient>
    <linearGradient id="reserve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4b728" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a06014" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect y="470" width="1200" height="160" fill="url(#reserve)"/>
  <path d="M0 470h1200" stroke="#f4b728" stroke-width="2" opacity="0.5"/>

  <!-- Transparent ledger rows dissolving into shielded points. -->
  <g stroke="#b0cee0" stroke-width="2" opacity="0.4">
    <path d="M80 150h90M200 150h60M290 150h120M80 196h50M150 196h130"/>
  </g>
  <g fill="#f4b728" opacity="0.75">
    <circle cx="90" cy="300" r="4"/><circle cx="150" cy="312" r="4"/>
    <circle cx="215" cy="298" r="4"/><circle cx="280" cy="316" r="4"/>
    <circle cx="345" cy="304" r="4"/>
  </g>

  <text x="80" y="420" fill="#fbf6ec" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="76" font-weight="500" letter-spacing="-2">Trading fees become Zcash.</text>
  <text x="80" y="560" fill="#f4b728" font-family="ui-monospace, monospace"
        font-size="26" letter-spacing="6">SHIELDED · ROBINHOOD CHAIN</text>
</svg>
