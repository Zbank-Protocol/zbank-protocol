<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="dark" />

    <title>ZBANK — Capital markets for Zcash</title>

      PNG rather than SVG: X, Facebook and LinkedIn silently drop SVG og:images. The raster is
      produced from scripts/og.html by `npm run og`.
    -->

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ZBANK — capital markets for Zcash" />

    <link rel="icon" type="image/svg+xml" href="/mark.svg" />

    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: system-ui; color: #f2f3f5; background: #050506">

          ZBANK is building a Zcash-native financial ecosystem on Robinhood Chain: ZEC-funded

      </div>

    <script type="module" src="/src/main.tsx"></script>
