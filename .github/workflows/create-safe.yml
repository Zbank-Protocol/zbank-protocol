name: create-protocol-safe

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Solo Safe owner address
        required: true
        type: string
      confirmation:
        description: Type ZBANK_CREATE_SOLO_SAFE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protocol-admin
  cancel-in-progress: false

jobs:
  create:
    if: inputs.confirmation == 'ZBANK_CREATE_SOLO_SAFE'
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Validate owner
        env:
          SAFE_OWNER: ${{ inputs.owner }}
        run: |
          [[ "$SAFE_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          [[ "${SAFE_OWNER,,}" != "0x47d51b066abd0695668a884e2e679fce8d7c8a3e" ]]
      - name: Create temporary solo Safe
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          SAFE_OWNERS: ${{ inputs.owner }}
          SAFE_THRESHOLD: "1"
          ALLOW_TEMPORARY_1_OF_1: "true"
        run: >
          forge script script/CreateSafe.s.sol
          --rpc-url https://rpc.mainnet.chain.robinhood.com
          --private-key "$PRIVATE_KEY"
          --broadcast
